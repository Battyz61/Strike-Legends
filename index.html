<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strike Legends</title><style>body{margin:0;background:#050914;color:#eef6ff;font-family:Arial,sans-serif}header{padding:18px;display:flex;justify-content:space-between;background:#08111f}.logo{font-size:25px;font-weight:bold;font-style:italic}.logo b{color:#55c7ff}.hero{padding:70px 8%;background:radial-gradient(circle at 70% 30%,#17487c,#050914 60%)}h1{font-size:60px;font-style:italic;margin:0}h1 span{color:#55c7ff;display:block}.btn{padding:14px;border:0;border-radius:12px;background:#2c9cff;color:white;font-weight:bold;margin:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:20px}.card{background:#0d192b;border:1px solid #29496e;border-radius:16px;padding:18px;text-align:center}.big{font-size:60px}.screen{display:none;padding:20px}.active{display:block}.back{background:#17253a;color:white;border:0;padding:10px;border-radius:10px}.pack{font-size:34px;padding:40px;background:linear-gradient(135deg,#252d83,#7c42ca);border-radius:22px;text-align:center}#log{background:#0b1525;padding:18px;border-radius:14px;margin:12px 0}@media(max-width:600px){h1{font-size:48px}}</style><body><header><div class="logo">STRIKE <b>LEGENDS</b></div><div>🪙 <span id="coin">12500</span> ⚡ <span id="energy">100</span></div></header><main id="home" class="active hero"><h1>STRIKE <span>LEGENDS</span></h1><p>Anime futbol RPG prototipi. Takımını kur, paket aç ve Legend Arena'da savaş.</p><button class="btn" onclick="show('match')">⚔️ MAÇA ÇIK</button><button class="btn" onclick="show('team')">👥 TAKIMIM</button><div class="grid"><button class="card" onclick="show('pack')">🎁<br>PAKET AÇ</button><button class="card" onclick="show('collection')">🃏<br>KOLEKSİYON</button></div></main><section id="collection" class="screen"><button class="back" onclick="show('home')">←</button><h2>🃏 KOLEKSİYON</h2><div class="grid" id="cards"></div></section><section id="team" class="screen"><button class="back" onclick="show('home')">←</button><h2>👥 STORM STRIKERS</h2><p>Takım Gücü: <b id="power">83</b></p><div id="teamcards" class="grid"></div></section><section id="pack" class="screen"><button class="back" onclick="show('home')">←</button><h2>🎁 AURA PACK</h2><div class="pack">⚡<br>AURA PACK</div><button class="btn" onclick="openPack()">250 🪙 KARŞILIĞINDA AÇ</button><p id="pull"></p></section><section id="match" class="screen"><button class="back" onclick="show('home')">←</button><h2>⚔️ STORM CUP</h2><h1 id="score">0 - 0</h1><div id="log">Takımın hazır.</div><button class="btn" onclick="play()">⚡ ÖZEL YETENEK</button><button class="btn" onclick="play(false)">⚽ NORMAL ATAK</button></section><script>let S=JSON.parse(localStorage.sl||'null')||{c:12500,e:100,w:0,cards:[['⚡','RAIDEN',86,'ST'],['🔥','AKIO',82,'CM'],['☀️','HIKARI',84,'LW'],['🌑','KURO',80,'CB'],['❄️','YUKI',83,'GK']]};function save(){localStorage.sl=JSON.stringify(S);coin.textContent=S.c;energy.textContent=S.e}function show(x){document.querySelectorAll('main,section').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');render()}function render(){cards.innerHTML=S.cards.map(x=>`<div class=card><div class=big>${x[0]}</div><b>${x[1]}</b><br>${x[2]} • ${x[3]}</div>`).join('');teamcards.innerHTML=cards.innerHTML;power.textContent=Math.round(S.cards.slice(0,5).reduce((a,x)=>a+x[2],0)/5)}function openPack(){if(S.c<250)return alert('Coin yetersiz');S.c-=250;let p=[['🌪️','SORA',79,'LW'],['🔥','REN',88,'ST'],['⚡','MIKA',93,'CM']][Math.floor(Math.random()*3)];S.cards.push(p);pull.textContent='✨ '+p[1]+' ('+p[2]+') geldi!';save()}let a=0,b=0;function play(s=true){if(!S.e)return alert('Enerji yok');S.e-=10;if(Math.random()<(s?.75:.5))a++;else if(Math.random()<.3)b++;score.textContent=a+' - '+b;log.textContent=a>=b?'⚡ Storm Strikers üstün!':'🔥 Rakip baskı kuruyor!';save()}render();save()</script>
