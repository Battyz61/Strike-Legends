<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hill Rush</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101827;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008;font-weight:900}.top{display:flex;justify-content:space-between;padding:16px}.pill{background:#111b2dcc;border:1px solid #fff3;border-radius:14px;padding:8px 12px}.controls{position:fixed;bottom:0;left:0;right:0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.btn{pointer-events:auto;width:92px;height:92px;border:2px solid #fff5;border-radius:50%;background:#17243dcc;color:white;font-weight:900;font-size:15px}.small{width:70px;height:70px}.stack{display:flex;gap:12px}.over{position:fixed;inset:0;display:none;place-items:center;background:#06101b99}.card{background:#121c2af5;color:white;border-radius:22px;padding:26px;text-align:center;min-width:260px}.card button{padding:12px 20px;border:0;border-radius:12px;font-weight:900}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="pill">🏁 <span id="d">0</span> m</div><div class="pill">🪙 <span id="co">0</span></div></div></div><div class="controls"><div class="stack"><button class="btn" id="b">◀<br>FREN</button><button class="btn" id="g">▶<br>GAZ</button></div><div class="stack"><button class="btn small" id="l">↶</button><button class="btn small" id="r">↷</button></div></div><div class="over" id="o"><div class="card"><h2>Takla attın 😵</h2><p><span id="fd">0</span> m • 🪙 <span id="fc">0</span></p><button id="re">Tekrar Sür</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,car,coins,cam,dead,got,last=0;const k={g:0,b:0,l:0,r:0};function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function hy(q){return H*.63+Math.sin(q*.004)*45+Math.sin(q*.009+1)*26+Math.sin(q*.018)*12+Math.sin(q*.0017)*75}function reset(){car={x:100,y:hy(100)-42,v:0,vy:0,a:0,va:0};coins=[];for(let q=350;q<16000;q+=180+Math.random()*220)coins.push({x:q,y:hy(q)-68,on:1});cam=0;dead=0;got=0;document.getElementById('o').style.display='none'}function upd(dt){if(dead)return;car.v+=((k.g?1:0)-(k.b?.65:0))*720*dt;car.v*=Math.pow(.985,dt*60);car.v=Math.max(-180,Math.min(700,car.v));car.vy+=1450*dt;car.x+=car.v*dt;car.y+=car.vy*dt;let gy=hy(car.x)-42,ground=car.y>=gy;if(ground){car.y=gy;if(car.vy>0)car.vy*=-.12}let slope=(hy(car.x+12)-hy(car.x-12))/24,target=Math.atan2(slope*car.v,Math.abs(car.v)+40);if(!ground){if(k.l)car.va-=7*dt;if(k.r)car.va+=7*dt}else car.va+=(target-car.a)*10*dt;car.a+=car.va*dt;car.va*=Math.pow(.84,dt*60);if(Math.abs(car.a)>Math.PI*1.65){dead=1;document.getElementById('fd').textContent=Math.max(0,Math.floor((car.x-100)/10));document.getElementById('fc').textContent=got;document.getElementById('o').style.display='grid'}for(const q of coins)if(q.on&&Math.hypot(q.x-car.x,q.y-car.y)<42){q.on=0;got++}cam+=(car.x-W*.28-cam)*Math.min(1,dt*5);document.getElementById('d').textContent=Math.max(0,Math.floor((car.x-100)/10));document.getElementById('co').textContent=got}
function draw(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#79c9ff');sky.addColorStop(.58,'#d9f3ff');sky.addColorStop(.581,'#d9b36b');sky.addColorStop(1,'#6ba844');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#73a4a0';x.beginPath();x.moveTo(0,H*.63);for(let q=0;q<=W;q+=20)x.lineTo(q,H*.53+Math.sin((q+cam*.2)*.006)*38);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.beginPath();x.moveTo(0,H);for(let q=-30;q<W+30;q+=10)x.lineTo(q,hy(q+cam));x.lineTo(W,H);x.closePath();x.fillStyle='#6caf45';x.fill();x.strokeStyle='#355f31';x.lineWidth=4;x.stroke();for(const q of coins)if(q.on){let sx=q.x-cam;if(sx>-30&&sx<W+30){x.fillStyle='#ffd447';x.beginPath();x.arc(sx,q.y,10,0,7);x.fill();x.strokeStyle='#b77812';x.stroke()}}let sx=car.x-cam;x.save();x.translate(sx,car.y);x.rotate(car.a);x.fillStyle='#e5483e';x.beginPath();x.roundRect(-38,-24,76,34,10);x.fill();x.fillStyle='#26364d';x.beginPath();x.roundRect(-20,-20,27,18,5);x.fill();x.fillStyle='#151b23';x.beginPath();x.arc(-24,14,13,0,7);x.arc(24,14,13,0,7);x.fill();x.fillStyle='#8797a8';x.beginPath();x.arc(-24,14,6,0,7);x.arc(24,14,6,0,7);x.fill();x.restore()}function loop(t){let dt=Math.min(.032,(t-last)/1000||.016);last=t;upd(dt);draw();requestAnimationFrame(loop)}function bind(id,key){let e=document.getElementById(id);e.addEventListener('pointerdown',z=>{z.preventDefault();k[key]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,z=>{z.preventDefault();k[key]=0}))}bind('g','g');bind('b','b');bind('l','l');bind('r','r');addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')k.g=1;if(e.key==='ArrowLeft'||e.key==='a')k.b=1;if(e.key==='ArrowUp'||e.key==='w')k.r=1;if(e.key==='ArrowDown'||e.key==='s')k.l=1});addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key==='d')k.g=0;if(e.key==='ArrowLeft'||e.key==='a')k.b=0;if(e.key==='ArrowUp'||e.key==='w')k.r=0;if(e.key==='ArrowDown'||e.key==='s')k.l=0});document.getElementById('re').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
