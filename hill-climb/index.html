<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hill Rush</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101827;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #0008;font-weight:900}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.pill{background:#111b2dcc;border:1px solid #fff3;border-radius:12px;padding:7px 10px}.controls{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.btn{pointer-events:auto;width:86px;height:86px;border:2px solid #fff5;border-radius:50%;background:#17243dcc;color:#fff;font-weight:900}.small{width:64px;height:64px;margin-top:11px}.stack{display:flex;gap:10px}.panel{position:fixed;left:12px;right:12px;bottom:118px;display:flex;gap:8px;justify-content:center;pointer-events:auto}.panel button{border:1px solid #fff3;background:#111b2ddd;color:#fff;border-radius:12px;padding:9px 11px;font-weight:800}.fuel{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:170px;height:12px;border:2px solid #fff8;border-radius:9px;background:#111b2d99;overflow:hidden}.fuel i{display:block;height:100%;width:100%;background:#6ed36e;transition:width .15s}.over{position:fixed;inset:0;display:none;place-items:center;background:#06101b99}.card{background:#121c2af5;color:#fff;border-radius:22px;padding:24px;text-align:center;min-width:270px}.card button{padding:12px 20px;border:0;border-radius:12px;font-weight:900}.garage{position:fixed;inset:0;display:none;place-items:center;background:#07101be8;color:#fff}.gcard{width:min(92%,440px);background:#131e2df7;border:1px solid #fff2;border-radius:20px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #fff1}.row button{background:#e6b83f;border:0;border-radius:9px;padding:8px 10px;font-weight:900}.close{margin-top:14px;width:100%;padding:11px;border:0;border-radius:10px}.badge{font-size:12px;opacity:.75;margin-top:4px}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 55%,#0003);mix-blend-mode:multiply}.pill{backdrop-filter:blur(8px)}.btn{box-shadow:0 8px 22px #0006;backdrop-filter:blur(8px)} </style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div><div class="pill">🏁 <span id="d">0</span> m</div><div class="badge">Rekor: <span id="best">0</span> m</div></div><div class="pill">🪙 <span id="co">0</span></div><div class="pill">⛽ <span id="fuelText">100</span>%</div></div></div><div class="fuel"><i id="fuel"></i></div><div class="panel"><button id="garageBtn">🔧 Garaj</button><button id="refuel">⛽ + Yakıt 25🪙</button></div><div class="controls"><div class="stack"><button class="btn" id="b">◀<br>FREN</button><button class="btn" id="g">▶<br>GAZ</button></div><div class="stack"><button class="btn small" id="l">↶</button><button class="btn small" id="r">↷</button></div></div><div class="over" id="o"><div class="card"><h2 id="endTitle">Takla attın 😵</h2><p><span id="fd">0</span> m • 🪙 <span id="fc">0</span></p><p>Toplam coin: 🪙 <span id="fw">0</span></p><button id="re">Tekrar Sür</button></div></div><div class="garage" id="ga"><div class="gcard"><h2>🔧 Garaj</h2><p>Coin cüzdanı: 🪙 <span id="gc">0</span></p><div class="row"><span>Motor Lv. <b id="engLv">1</b></span><button data-up="engine">+ Motor — <span id="engCost">70</span>🪙</button></div><div class="row"><span>Lastik Lv. <b id="tireLv">1</b></span><button data-up="tire">+ Lastik — <span id="tireCost">70</span>🪙</button></div><div class="row"><span>Depo Lv. <b id="tankLv">1</b></span><button data-up="tank">+ Depo — <span id="tankCost">85</span>🪙</button></div><button class="close" id="closeGarage">Kapat</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,car,coins,cam,dead,got,fuel,last=0,dist=0;const saveKey='hillRushSaveV2';let save=JSON.parse(localStorage.getItem(saveKey)||'null')||{wallet:0,best:0,engine:1,tire:1,tank:1};const stats=save;const k={g:0,b:0,l:0,r:0};let particles=[];
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function hy(q){const base=H*.63;return base+Math.sin(q*.0032)*58+Math.sin(q*.0071+1.4)*30+Math.sin(q*.014)*15+Math.sin(q*.0013)*82+Math.sin(q*.027)*5}
function slopeAt(q){return (hy(q+8)-hy(q-8))/16}
function wheelY(px){return hy(px)-18}
function persist(){localStorage.setItem(saveKey,JSON.stringify(save))}
function reset(){car={x:100,y:hy(100)-42,v:0,vy:0,a:0,va:0};coins=[];for(let q=350;q<30000;q+=170+Math.random()*210)coins.push({x:q,y:hy(q)-68,on:1});cam=0;dead=0;got=0;fuel=Math.min(100,72+stats.tank*8);dist=0;particles=[];document.getElementById('o').style.display='none';ui()}
function ui(){document.getElementById('d').textContent=Math.max(0,Math.floor(dist));document.getElementById('co').textContent=stats.wallet;document.getElementById('gc').textContent=stats.wallet;document.getElementById('best').textContent=Math.floor(stats.best);document.getElementById('fuel').style.width=fuel+'%';document.getElementById('fuelText').textContent=Math.ceil(fuel);document.getElementById('engLv').textContent=stats.engine;document.getElementById('tireLv').textContent=stats.tire;document.getElementById('tankLv').textContent=stats.tank;document.getElementById('engCost').textContent=40+stats.engine*30;document.getElementById('tireCost').textContent=40+stats.tire*30;document.getElementById('tankCost').textContent=50+stats.tank*35}
function end(title){if(dead)return;dead=1;stats.best=Math.max(stats.best,dist);persist();document.getElementById('endTitle').textContent=title;document.getElementById('fd').textContent=Math.max(0,Math.floor(dist));document.getElementById('fc').textContent=got;document.getElementById('fw').textContent=stats.wallet;document.getElementById('o').style.display='grid';ui()}
function upd(dt){if(dead)return;
const power=690*(1+stats.engine*.13),maxV=620+stats.engine*55;
if(k.g)car.v+=power*dt;if(k.b)car.v-=power*.58*dt;
car.v*=Math.pow(.985,dt*60);car.v=Math.max(-170,Math.min(maxV,car.v));
if(k.g){fuel-=dt*(2.05-.1*stats.tank);if(Math.random()<dt*24)particles.push({x:car.x-45,y:car.y-2,vx:-35-Math.random()*45,vy:-15-Math.random()*35,life:.55})}
if(fuel<=0){fuel=0;end('Yakıt Bitti ⛽');return}
const rearX=car.x-27,frontX=car.x+27,rearG=wheelY(rearX),frontG=wheelY(frontX);
car.vy+=1320*dt;car.x+=car.v*dt;car.y+=car.vy*dt;
const bodyBottom=car.y+20,ground=Math.min(rearG,frontG);
if(bodyBottom>=ground){car.y=ground-20; if(car.vy>0)car.vy*=-.16; car.vy+=slopeAt(car.x)*car.v*2.2*dt}
const target=Math.atan2(hy(frontX)-hy(rearX),54);
if(!ground||Math.abs(car.vy)>30){if(k.l)car.va-=6.5*(1+stats.tire*.06)*dt;if(k.r)car.va+=6.5*(1+stats.tire*.06)*dt}
car.va+=(target-car.a)*(ground?12+stats.tire*.8:1.2)*dt;car.a+=car.va*dt;car.va*=Math.pow(.86,dt*60);
if(Math.abs(car.a)>Math.PI*1.65){end('Takla attın 😵');return}
for(const q of coins)if(q.on&&Math.hypot(q.x-car.x,q.y-car.y)<46){q.on=0;got++;stats.wallet++;persist();particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*80,vy:-100,life:.55})}
cam+=(car.x-W*.28-cam)*Math.min(1,dt*5);dist=Math.max(0,(car.x-100)/10);ui();
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function draw(){
const day=(Math.sin(car.x*.00035)+1)/2, night=1-day;
let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,day>.45?'#69bff4':'#090d27');sky.addColorStop(.58,day>.45?'#d9f2ff':'#263252');sky.addColorStop(1,day>.45?'#75aa4b':'#1c2630');x.fillStyle=sky;x.fillRect(0,0,W,H);
x.globalAlpha=.9;for(let i=0;i<7;i++){let cx=((i*240-cam*.08)%(W+300))-120,cy=80+(i%3)*42;x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,22,0,7);x.arc(cx+25,cy-10,28,0,7);x.arc(cx+55,cy,20,0,7);x.fill()}x.globalAlpha=1;
x.fillStyle=day>.45?'#7899a0':'#303952';x.beginPath();x.moveTo(0,H*.63);for(let q=0;q<=W;q+=18)x.lineTo(q,H*.52+Math.sin((q+cam*.16)*.005)*45);x.lineTo(W,H);x.lineTo(0,H);x.fill();
x.beginPath();x.moveTo(0,H);for(let q=-30;q<W+30;q+=8)x.lineTo(q,hy(q+cam));x.lineTo(W,H);x.closePath();let g=x.createLinearGradient(0,H*.55,0,H);g.addColorStop(0,day>.45?'#80c45a':'#405d43');g.addColorStop(1,day>.45?'#39703c':'#1f3529');x.fillStyle=g;x.fill();x.strokeStyle=day>.45?'#2c592d':'#18281f';x.lineWidth=5;x.stroke();
x.fillStyle=day>.45?'#fff3a6':'#eaf0ff';x.beginPath();x.arc(W-75,82,day>.45?28:20,0,7);x.fill();
for(const q of coins)if(q.on){let sx=q.x-cam;if(sx>-30&&sx<W+30){x.save();x.translate(sx,q.y);x.rotate(performance.now()*.003);x.fillStyle='#ffd447';x.strokeStyle='#b87810';x.lineWidth=2;x.beginPath();x.ellipse(0,0,10,13,0,0,7);x.fill();x.stroke();x.restore()}}
for(const p of particles){let sx=p.x-cam;x.globalAlpha=Math.max(0,p.life*2);x.fillStyle='#ddd';x.beginPath();x.arc(sx,p.y,3+p.life*5,0,7);x.fill();x.globalAlpha=1}
const sx=car.x-cam;x.save();x.translate(sx,car.y);x.rotate(car.a);
const bob=Math.sin(performance.now()*.02+car.x*.03)*1.5;x.strokeStyle='#20242b';x.lineWidth=4;x.beginPath();x.moveTo(-27,5);x.lineTo(-31,18);x.moveTo(27,5);x.lineTo(31,18);x.stroke();
x.fillStyle='#b92f2a';x.beginPath();x.roundRect(-41,-23+bob,82,35,11);x.fill();x.fillStyle='#ef5548';x.fillRect(-34,-18+bob,68,7);
x.fillStyle='#26364d';x.beginPath();x.moveTo(-21,-20+bob);x.lineTo(-10,-34+bob);x.lineTo(18,-32+bob);x.lineTo(29,-20+bob);x.closePath();x.fill();x.fillStyle='#9bdaf0';x.beginPath();x.moveTo(-14,-27+bob);x.lineTo(-7,-30+bob);x.lineTo(5,-29+bob);x.lineTo(9,-21+bob);x.lineTo(-14,-21+bob);x.closePath();x.fill();
x.fillStyle='#151a20';x.beginPath();x.arc(-25,15,15,0,7);x.arc(25,15,15,0,7);x.fill();x.fillStyle='#9caab8';x.beginPath();x.arc(-25,15,7,0,7);x.arc(25,15,7,0,7);x.fill();x.fillStyle='#3e4b59';x.beginPath();x.arc(-25,15,3,0,7);x.arc(25,15,3,0,7);x.fill();x.restore()}
function bind(id,key){let e=document.getElementById(id);e.addEventListener('pointerdown',z=>{z.preventDefault();k[key]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,z=>{z.preventDefault();k[key]=0}))}bind('g','g');bind('b','b');bind('l','l');bind('r','r');
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')k.g=1;if(e.key==='ArrowLeft'||e.key==='a')k.b=1;if(e.key==='ArrowUp'||e.key==='w')k.r=1;if(e.key==='ArrowDown'||e.key==='s')k.l=1});addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key==='d')k.g=0;if(e.key==='ArrowLeft'||e.key==='a')k.b=0;if(e.key==='ArrowUp'||e.key==='w')k.r=0;if(e.key==='ArrowDown'||e.key==='s')k.l=0});
document.getElementById('re').onclick=reset;document.getElementById('garageBtn').onclick=()=>document.getElementById('ga').style.display='grid';document.getElementById('closeGarage').onclick=()=>document.getElementById('ga').style.display='none';document.getElementById('refuel').onclick=()=>{if(stats.wallet>=25&&!dead){stats.wallet-=25;fuel=Math.min(100,fuel+35);persist();ui()}};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let s=b.dataset.up,cost=(s==='tank'?50:40)+stats[s]*30;if(stats.wallet>=cost&&stats[s]<10){stats.wallet-=cost;stats[s]++;persist();ui()}});reset();function loop(t){let dt=Math.min(.032,(t-last)/1000||.016);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
