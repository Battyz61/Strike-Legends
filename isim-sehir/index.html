<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İsim Şehir • Arkadaşlarla Oyna</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% 10%,#334155,#0f172a 45%,#020617)}.wrap{max-width:1000px;margin:auto;padding:24px}.hero{text-align:center;padding:34px 8px 24px}.badge{display:inline-block;padding:7px 12px;border:1px solid #475569;border-radius:99px;color:#cbd5e1;background:#0f172acc}.hero h1{font-size:clamp(42px,8vw,72px);margin:14px 0 6px;letter-spacing:-3px}.hero p{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#0f172aee;border:1px solid #334155;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0006}.input{width:100%;padding:14px;margin:6px 0;background:#020617;border:1px solid #334155;border-radius:12px;color:white;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:12px;margin-top:8px;background:#2563eb;color:white;font-size:16px;font-weight:800;cursor:pointer}.btn.alt{background:#1e293b}.room{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.code{font-size:25px;font-weight:900;letter-spacing:4px;color:#93c5fd}.players{display:flex;flex-wrap:wrap;gap:8px}.player{background:#1e293b;border:1px solid #334155;padding:9px 12px;border-radius:99px}.letter{text-align:center;font-size:78px;font-weight:1000;color:#60a5fa;margin:6px}.timer{text-align:center;font-size:22px;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer label{display:block;color:#94a3b8;font-size:13px;margin-bottom:4px}.answer input{width:100%;padding:12px;background:#020617;color:#fff;border:1px solid #334155;border-radius:10px}.status{padding:12px;background:#172554;color:#bfdbfe;border-radius:11px;margin:12px 0}.hidden{display:none}@media(max-width:700px){.grid,.answers{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">🎮 Arkadaşlarınla çevrim içi</span><h1>İsim Şehir</h1><p>Odayı kur • kodu paylaş • harfi al • yarış!</p></section><section id="lobby" class="grid"><div class="card"><h2>🚀 Oda Kur</h2><input id="host" class="input" placeholder="Adın" maxlength="18"><button class="btn" onclick="create()">Oda Oluştur</button></div><div class="card"><h2>🎟️ Odaya Katıl</h2><input id="guest" class="input" placeholder="Adın" maxlength="18"><input id="codeIn" class="input" placeholder="Oda kodu" maxlength="6"><button class="btn alt" onclick="join()">Odaya Katıl</button></div></section><section id="room" class="room"><div class="card"><div class="top"><div><small>ODA KODU</small><div id="code" class="code"></div></div><button class="btn alt" style="width:auto" onclick="navigator.clipboard?.writeText(code.textContent);alert('Kod kopyalandı!')">Kopyala</button></div><h3>Oyuncular</h3><div id="players" class="players"></div><button id="start" class="btn" onclick="start()">Oyunu Başlat</button></div><div id="game" class="card hidden" style="margin-top:16px"><div class="top"><h2>🔥 Tur</h2><span id="round">1. Tur</span></div><div id="letter" class="letter">A</div><div id="timer" class="timer">60 sn</div><div class="status">Cevapların seçilen harfle başlamalı.</div><div id="answers" class="answers"></div><button class="btn" onclick="finish()">Cevapları Gönder</button></div></section></main><script>const cats=['İsim','Şehir','Hayvan','Bitki','Eşya','Ülke'],letters='ABCÇDEFGĞHİIJKLMNOÖPRSŞTUÜVYZ'.split('');let t,sec=60,r=1;function openRoom(name,guest){document.getElementById('lobby').classList.add('hidden');document.getElementById('room').style.display='block';document.getElementById('code').textContent=guest?(document.getElementById('codeIn').value.trim().toUpperCase()||rnd()):rnd();document.getElementById('players').innerHTML='<span class="player">👑 '+(name||'Oyuncu')+'</span>'+(guest?'<span class="player">🧑 Oda sahibi</span>':'')}function rnd(){return Math.floor(100000+Math.random()*900000)}function create(){openRoom(document.getElementById('host').value.trim(),false)}function join(){openRoom(document.getElementById('guest').value.trim(),true)}function start(){start.hidden=true;game.classList.remove('hidden');round()}function round(){letter.textContent=letters[Math.floor(Math.random()*letters.length)];round.textContent=r+'. Tur';answers.innerHTML=cats.map(x=>'<div class="answer"><label>'+x+'</label><input placeholder="'+x+'..."></div>').join('');sec=60;clearInterval(t);t=setInterval(()=>{timer.textContent=(--sec)+' sn';if(sec<=0)finish()},1000)}function finish(){clearInterval(t);timer.textContent='Tur tamamlandı';setTimeout(()=>{r++;round()},500)}</script></body></html>
