<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>İsim Şehir — Arkadaşlarla Oyna</title>
<style>
:root{--bg:#060b14;--panel:#0d1626;--line:#24334a;--text:#f8fafc;--muted:#8fa1b8;--blue:#4f8cff;--cyan:#22d3ee;--green:#34d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(800px 500px at 10% -10%,#19355d 0,transparent 65%),radial-gradient(700px 500px at 100% 20%,#163c46 0,transparent 60%),var(--bg)}
button,input{font:inherit}.wrap{max-width:1080px;margin:auto;padding:20px}.hero{text-align:center;padding:30px 8px}.logo{font-size:14px;font-weight:900;letter-spacing:2px;color:#93c5fd}.hero h1{font-size:clamp(42px,8vw,76px);line-height:.95;letter-spacing:-4px;margin:12px 0;background:linear-gradient(90deg,#fff,#8ec5ff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:linear-gradient(180deg,#101b2dF2,#091221F2);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 25px 80px #0007}.card h2{margin:0 0 16px}.input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#050b14;color:#fff;outline:0;margin:5px 0}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4f8cff22}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;margin-top:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-weight:900;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.secondary{background:#172338}.btn.small{width:auto;padding:10px 13px;margin:0}.room{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.code{font-size:27px;font-weight:1000;letter-spacing:5px;color:#7dd3fc}.players{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.player{padding:9px 12px;border:1px solid #30425d;border-radius:999px;background:#121f33}.game{margin-top:16px}.roundbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.roundnum{padding:7px 10px;border-radius:99px;background:#13233a;color:#9cc5ff}.letter{font-size:100px;line-height:1;text-align:center;font-weight:1000;margin:12px;color:#67b7ff;text-shadow:0 0 40px #3182ce55}.timer{text-align:center;font-size:25px;font-weight:1000}.timer.danger{color:var(--red);animation:pulse .7s infinite}.status{text-align:center;padding:11px;margin:14px 0;border-radius:12px;background:#0d2740;color:#a8d8ff}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer label{display:block;color:var(--muted);font-size:13px;margin:0 0 5px}.answer input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#050b14;color:white;outline:0}.answer input.valid{border-color:var(--green)}.answer input.invalid{border-color:var(--red)}.bot-block{grid-column:1/-1;border:1px solid #263852;border-radius:16px;padding:12px;background:#091321}.bot-name{font-weight:900;color:#a8d8ff;margin-bottom:8px}.vote-title{font-size:20px;font-weight:900;margin-bottom:5px}.vote-help{color:var(--muted);font-size:14px;margin-bottom:12px}.vote-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#08111d;margin:8px 0}.vote-answer{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.vote-answer span{color:var(--muted);font-size:13px}.vote-answer b{font-size:15px}.vote-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vote{padding:10px;border-radius:10px;border:1px solid #334155;background:#111d2e;color:#fff;font-weight:800;cursor:pointer}.vote.yes.selected{background:#065f46;border-color:#34d399}.vote.no.selected{background:#881337;border-color:#fb7185}.vote.disabled{opacity:.35;cursor:not-allowed}@media(max-width:700px){.vote-answer{display:block}.vote-answer b{display:block;margin-top:3px}}.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.score{padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b1422}.score b{display:block;font-size:22px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;padding:12px 16px;border-radius:12px;background:#e2e8f0;color:#07111e;font-weight:800;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{transform:scale(1.04)}}@media(max-width:700px){.wrap{padding:12px}.grid,.answers{grid-template-columns:1fr}.hero{padding:22px 4px}.card{padding:17px}.letter{font-size:82px}}
</style></head>
<body><main class="wrap">
<section class="hero"><div class="logo">⚡ ARKADAŞLARLA OYNA</div><h1>İsim Şehir</h1><p>Odayı kur, kodu paylaş ve en hızlı cevaplayan ol.</p></section>
<section id="lobby" class="grid">
<div class="card"><h2>🚀 Oda Kur</h2><input id="hostName" class="input" maxlength="18" placeholder="Adın"><button class="btn" onclick="createRoom()">Oda Oluştur</button></div>
<div class="card"><h2>🎟️ Odaya Katıl</h2><input id="guestName" class="input" maxlength="18" placeholder="Adın"><input id="joinCode" class="input" maxlength="6" placeholder="6 haneli oda kodu"><button class="btn secondary" onclick="joinRoom()">Odaya Katıl</button></div>
</section>
<section id="room" class="room">
<div class="card"><div class="top"><div><small style="color:var(--muted)">ODA KODU</small><div id="roomCode" class="code"></div></div><button class="btn secondary small" onclick="copyRoom()">Kodu Kopyala</button></div>
<h3>👥 Oyuncular</h3><div id="players" class="players"></div><button id="botBtn" class="btn secondary" onclick="addBot()">🤖 Test Botu Ekle</button><button id="startBtn" class="btn" onclick="startGame()">Oyunu Başlat</button></div>
<div id="game" class="card game hidden"><div class="roundbar"><h2 style="margin:0">🔥 Yarış</h2><span id="roundNo" class="roundnum">1. Tur</span></div>
<div id="letter" class="letter">A</div><div id="timer" class="timer">60 sn</div><div id="status" class="status">Cevaplarını seçilen harfle doldur.</div><div id="answers" class="answers"></div>
<button id="finishBtn" class="btn" onclick="finishRound()">Cevapları Gönder</button><div class="scorebar"><div class="score">Sen<b id="myScore">0</b></div><div class="score">Rakip<b id="enemyScore">0</b></div><div class="score">Tur<b id="roundScore">0</b></div></div></div>
</section></main><div id="toast" class="toast"></div>
<script>
const cats=['İsim','Şehir','Hayvan','Bitki','Eşya','Ülke'];
const letters='ABCÇDEFGĞHİIJKLMNOÖPRSŞTUÜVYZ'.split('');
let timerId,seconds=60,round=1,myScore=0,roomId='',me='',letterNow='',bots=[];
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
function enter(name,join){me=(name||'Oyuncu').trim()||'Oyuncu';roomId=join?($('joinCode').value.trim()||makeCode()):makeCode();$('lobby').classList.add('hidden');$('room').style.display='block';$('roomCode').textContent=roomId;renderPlayers()}
function createRoom(){enter($('hostName').value,false)}
function joinRoom(){enter($('guestName').value,true)}
function copyRoom(){navigator.clipboard?.writeText(roomId);toast('Oda kodu kopyalandı!')}
function addBot(){if(bots.length>=3){toast('En fazla 3 test botu.');return}bots.push({name:'Bot '+(bots.length+1),score:0,answers:[]});renderPlayers();toast('🤖 Test botu eklendi')}
function renderPlayers(){$('players').innerHTML='<span class="player">👑 '+esc(me)+'</span>'+bots.map(b=>'<span class="player">🤖 '+esc(b.name)+'</span>').join('')+(bots.length?'':'<span class="player">⏳ Arkadaşın bekleniyor</span>')}
function startGame(){$('startBtn').classList.add('hidden');$('botBtn').classList.add('hidden');$('game').classList.remove('hidden');newRound()}
function newRound(){
 letterNow=letters[Math.floor(Math.random()*letters.length)];
 $('letter').textContent=letterNow;$('roundNo').textContent=round+'. Tur';
 $('answers').innerHTML=cats.map(c=>'<div class="answer"><label>'+c+'</label><input maxlength="30" data-cat="'+c+'" placeholder="'+c+'..."></div>').join('');
 seconds=60;$('timer').textContent='60 sn';$('timer').classList.remove('danger');$('status').textContent='Cevaplarını '+letterNow+' harfiyle doldur.';
 $('finishBtn').textContent='Cevapları Gönder';$('finishBtn').disabled=false;$('finishBtn').onclick=finishRound;
 clearInterval(timerId);timerId=setInterval(()=>{seconds--;$('timer').textContent=seconds+' sn';if(seconds<=10)$('timer').classList.add('danger');if(seconds<=0)finishRound()},1000);
}
function pickForLetter(cat){
 const bank={İsim:{A:'Ahmet',B:'Burak',M:'Mert',S:'Selin'},Şehir:{A:'Ankara',B:'Bursa',T:'Trabzon',İ:'İzmir'},Hayvan:{A:'At',K:'Kedi',M:'Maymun',T:'Tavşan'},Bitki:{A:'Armut',L:'Lale',N:'Nane',Ç:'Çam'},Eşya:{M:'Masa',K:'Kalem',S:'Saat',T:'Telefon'},Ülke:{A:'Almanya',İ:'İtalya',J:'Japonya',T:'Türkiye'}};
 return bank[cat]?.[letterNow]||letterNow+' örnek';
}
function botAnswers(){return cats.map(c=>({cat:c,val:Math.random()>.25?pickForLetter(c):'Alakasız cevap'}))}
function finishRound(){if($('finishBtn').disabled)return;$('finishBtn').disabled=true;clearInterval(timerId);$('timer').classList.remove('danger');bots.forEach(b=>b.answers=botAnswers());showVoting()}
function vote(btn,correct){const row=btn.closest('.vote-row');row.querySelectorAll('.vote').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');row.dataset.vote=correct?'yes':'no'}
function voteRow(owner,x,empty=false){return '<div class="vote-row" data-owner="'+owner+'"><div class="vote-answer"><span>'+esc(x.cat)+'</span><b>'+esc(x.val||'Cevap yok')+'</b></div><div class="vote-buttons"><button class="vote yes '+(empty?'disabled':'')+'" '+(empty?'disabled':'')+' onclick="vote(this,true)">✓ Doğru</button><button class="vote no '+(empty?'disabled':'')+'" '+(empty?'disabled':'')+' onclick="vote(this,false)">✕ Yanlış</button></div></div>'}
function showVoting(){
 const mine=[...$('answers').querySelectorAll('input')].map(i=>({cat:i.dataset.cat,val:i.value.trim()}));
 let html='<div class="bot-block"><div class="vote-title">🗳️ '+esc(me)+' cevapları</div>'+mine.map(x=>voteRow('me',x,!x.val)).join('')+'</div>';
 bots.forEach((b,bi)=>{html+='<div class="bot-block"><div class="bot-name">🤖 '+esc(b.name)+' cevapları</div>'+b.answers.map(x=>voteRow('bot'+bi,x,false)).join('')+'</div>'});
 $('answers').innerHTML=html;$('finishBtn').textContent='Oylamayı Tamamla';$('finishBtn').disabled=false;$('finishBtn').onclick=completeVoting;$('status').textContent='Cevaplara Doğru / Yanlış oyu ver.';
}
function completeVoting(){
 const rows=[...$('answers').querySelectorAll('.vote-row')];let missing=0,gained=0;
 rows.forEach(row=>{const disabled=row.querySelector('.vote:not([disabled])')===null;if(!disabled&&!row.dataset.vote)missing++;if(row.dataset.owner==='me'&&row.dataset.vote==='yes')gained+=10});
 if(missing){toast(missing+' cevap için oy eksik.');return}
 myScore+=gained;$('myScore').textContent=myScore;$('roundScore').textContent=gained;$('status').textContent='Tur tamamlandı: +'+gained+' puan';$('finishBtn').disabled=true;
 setTimeout(()=>{round++;newRound()},1500);
}
</script></body></html>
