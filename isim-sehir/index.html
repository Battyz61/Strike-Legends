<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>İsim Şehir — Arkadaşlarla Oyna</title>
<style>
:root{--bg:#060b14;--panel:#0d1626;--line:#24334a;--text:#f8fafc;--muted:#8fa1b8;--blue:#4f8cff;--cyan:#22d3ee;--green:#34d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(800px 500px at 10% -10%,#19355d 0,transparent 65%),radial-gradient(700px 500px at 100% 20%,#163c46 0,transparent 60%),var(--bg)}
button,input{font:inherit}.wrap{max-width:1080px;margin:auto;padding:20px}.hero{text-align:center;padding:30px 8px}.logo{font-size:14px;font-weight:900;letter-spacing:2px;color:#93c5fd}.hero h1{font-size:clamp(42px,8vw,76px);line-height:.95;letter-spacing:-4px;margin:12px 0;background:linear-gradient(90deg,#fff,#8ec5ff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:linear-gradient(180deg,#101b2dF2,#091221F2);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 25px 80px #0007}.card h2{margin:0 0 16px}.input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--line);background:#050b14;color:#fff;outline:0;margin:5px 0}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4f8cff22}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;margin-top:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-weight:900;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.secondary{background:#172338}.btn.small{width:auto;padding:10px 13px;margin:0}.room{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.code{font-size:27px;font-weight:1000;letter-spacing:5px;color:#7dd3fc}.players{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.player{padding:9px 12px;border:1px solid #30425d;border-radius:999px;background:#121f33}.game{margin-top:16px}.roundbar{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.roundnum{padding:7px 10px;border-radius:99px;background:#13233a;color:#9cc5ff}.letter{font-size:100px;line-height:1;text-align:center;font-weight:1000;margin:12px;color:#67b7ff;text-shadow:0 0 40px #3182ce55}.timer{text-align:center;font-size:25px;font-weight:1000}.timer.danger{color:var(--red);animation:pulse .7s infinite}.status{text-align:center;padding:11px;margin:14px 0;border-radius:12px;background:#0d2740;color:#a8d8ff}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer label{display:block;color:var(--muted);font-size:13px;margin:0 0 5px}.answer input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#050b14;color:white;outline:0}.answer input.valid{border-color:var(--green)}.answer input.invalid{border-color:var(--red)}.vote-title{font-size:22px;font-weight:950;margin-bottom:5px}.vote-help{color:var(--muted);font-size:14px;margin-bottom:16px}.vote-category{margin:18px 0 22px}.vote-category-title{font-size:22px;font-weight:900;margin:0 0 9px;color:#b9d8ff}.vote-card{border:1px solid #263852;border-radius:17px;background:linear-gradient(180deg,#101923f5,#0a111bf5);overflow:hidden}.vote-player{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid #1d2b40;min-height:78px}.vote-player:last-child{border-bottom:0}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#243449;font-size:23px;border:2px solid #354b67}.avatar.bot{background:#1c2939}.vote-info{min-width:0}.vote-name{font-size:12px;color:#91a5bd;margin-bottom:2px}.vote-value{font-size:20px;font-weight:850;overflow-wrap:anywhere}.vote-note{font-size:12px;color:#7dd3a7;margin-top:3px}.vote-actions{display:flex;gap:8px;align-items:center}.vote-circle{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;font-size:21px;font-weight:1000;cursor:pointer;color:#fff;background:#243448;transition:.15s}.vote-circle.yes:hover,.vote-circle.yes.selected{background:#239b59;box-shadow:0 0 0 3px #239b5930}.vote-circle.no:hover,.vote-circle.no.selected{background:#d94756;box-shadow:0 0 0 3px #d9475630}.vote-circle.selected{transform:scale(1.04)}.vote-circle.disabled{opacity:.3;cursor:not-allowed}.vote-summary{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid #263852;border-radius:14px;background:#0b1524;margin-top:14px}.vote-summary span{color:var(--muted);font-size:13px}.vote-summary b{font-size:18px}@media(max-width:700px){.vote-player{grid-template-columns:40px 1fr auto;padding:11px 10px;gap:9px}.avatar{width:38px;height:38px;font-size:19px}.vote-value{font-size:18px}.vote-circle{width:40px;height:40px}.vote-actions{gap:5px}.vote-category-title{font-size:20px}}.vote-title{font-size:20px;font-weight:900;margin-bottom:5px}.vote-help{color:var(--muted);font-size:14px;margin-bottom:12px}.vote-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#08111d;margin:8px 0}.vote-answer{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.vote-answer span{color:var(--muted);font-size:13px}.vote-answer b{font-size:15px}.vote-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vote{padding:10px;border-radius:10px;border:1px solid #334155;background:#111d2e;color:#fff;font-weight:800;cursor:pointer}.vote.yes.selected{background:#065f46;border-color:#34d399}.vote.no.selected{background:#881337;border-color:#fb7185}.vote.disabled{opacity:.35;cursor:not-allowed}@media(max-width:700px){.vote-answer{display:block}.vote-answer b{display:block;margin-top:3px}}.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.score{padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b1422}.score b{display:block;font-size:22px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;padding:12px 16px;border-radius:12px;background:#e2e8f0;color:#07111e;font-weight:800;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{transform:scale(1.04)}}@media(max-width:700px){.wrap{padding:12px}.grid,.answers{grid-template-columns:1fr}.hero{padding:22px 4px}.card{padding:17px}.letter{font-size:82px}}
.category-panel{padding:20px}.cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.lang{color:#8ec5ff;font-weight:800}.category-options{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.cat-chip{border:1px solid #3d6590;background:transparent;color:#e5edf8;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700;transition:.15s}.cat-chip:hover{border-color:#6ea9e9}.cat-chip.active{background:#86afd0;color:#08111f;border-color:#8dc8ff}.selected-title{margin-top:14px;color:var(--muted);font-size:13px;font-weight:800}.selected-cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;min-height:36px}.selected-cat{padding:8px 11px;border:1px solid #3975b7;border-radius:10px;color:#dbeafe;background:#0d2036}.selected-cat button{border:0;background:none;color:#60a5fa;font-weight:900;cursor:pointer;margin-left:5px}.shuffle{margin-top:2px}.category-empty{color:#fb7185;font-size:13px;padding:7px 0}@media(max-width:700px){.cat-chip{padding:9px 12px}.cat-head{align-items:flex-start}}.settings-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.setting{padding:12px;border:1px solid #263852;border-radius:13px;background:#091321}.setting label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:6px}.setting select{width:100%;padding:10px;border-radius:10px;background:#111d2e;color:#fff;border:1px solid #35516f;outline:0}.wheel-wrap{height:190px;display:grid;place-items:center;position:relative;margin:4px 0}.wheel{width:158px;height:158px;border-radius:50%;border:7px solid #355d86;background:conic-gradient(#173b61 0deg 30deg,#102d4b 30deg 60deg,#173b61 60deg 90deg,#102d4b 90deg 120deg,#173b61 120deg 150deg,#102d4b 150deg 180deg,#173b61 180deg 210deg,#102d4b 210deg 240deg,#173b61 240deg 270deg,#102d4b 270deg 300deg,#173b61 300deg 330deg,#102d4b 330deg 360deg);box-shadow:0 0 35px #3388cc44;display:grid;place-items:center;position:relative}.wheel::after{content:"";position:absolute;inset:15px;border-radius:50%;background:#07111e;border:2px solid #4b7197}.wheel-center{position:relative;z-index:2;font-size:42px;font-weight:1000;color:#fff}.wheel-pointer{position:absolute;top:0;z-index:3;font-size:27px;color:#fbbf24;text-shadow:0 2px 8px #000}.wheel.spinning{animation:wheelSpin 2.2s cubic-bezier(.12,.75,.2,1)}.wheel-label{text-align:center;color:#8fa1b8;font-size:13px;margin-top:-5px}.answers.hidden-answers{display:none}@keyframes wheelSpin{0%{transform:rotate(0)}15%{transform:rotate(120deg)}100%{transform:rotate(1440deg)}}.vote-voters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.player-vote{display:inline-flex;width:18px;height:18px;min-width:18px;padding:0;border-radius:4px;font-size:0;border:1px solid #52647a}.player-vote.yes{border-color:#239b59;background:#239b59}.player-vote.no{border-color:#d94756;background:#d94756}.player-vote.pending{display:none}.vote-result{display:none}@media(max-width:700px){.leader-row{padding:12px 10px}}</style></head>
<body><main class="wrap">
<section class="hero"><div class="logo">⚡ ARKADAŞLARLA OYNA</div><h1>İsim Şehir</h1><p>Odayı kur, kodu paylaş ve en hızlı cevaplayan ol.</p></section>
<section id="lobby" class="grid">
<div class="card"><h2>🚀 Oda Kur</h2><input id="hostName" class="input" maxlength="18" placeholder="Adın"><button class="btn" onclick="createRoom()">Oda Oluştur</button></div>
<div class="card"><h2>🎟️ Odaya Katıl</h2><input id="guestName" class="input" maxlength="18" placeholder="Adın"><input id="joinCode" class="input" maxlength="6" placeholder="6 haneli oda kodu"><button class="btn secondary" onclick="joinRoom()">Odaya Katıl</button></div>
</section>
<div id="categoryPanel" class="card category-panel" style="margin-top:16px">
<div class="cat-head"><div><small style="color:var(--muted)">OYUN AYARLARI</small><h2 style="margin:4px 0 0">🎯 Kategoriler</h2></div><span class="lang">🇹🇷 Türkçe⌄</span></div>
<div id="categoryOptions" class="category-options"></div>
<button class="btn secondary shuffle" onclick="shuffleCats()">🔀 Karıştır</button>
<div class="selected-title">Seçilen kategoriler</div><div id="selectedCats" class="selected-cats"></div>
<div class="settings-row">
<div class="setting"><label>⏱️ TUR SÜRESİ</label><select id="durationSelect"><option value="30">30 saniye</option><option value="60">1 dakika</option><option value="120" selected>2 dakika</option><option value="180">3 dakika</option></select></div>
<div class="setting"><label>🎡 HARF ÇARKI</label><select id="wheelSelect"><option value="on" selected>Açık</option><option value="off">Kapalı</option></select></div>
</div>
</div><section id="room" class="room">
<div class="card"><div class="top"><div><small style="color:var(--muted)">ODA KODU</small><div id="roomCode" class="code"></div></div><button class="btn secondary small" onclick="copyRoom()">Kodu Kopyala</button></div>
<h3>👥 Oyuncular</h3><div id="players" class="players"></div><div class="settings-row"><div class="setting"><label>👥 OYUNCU LİMİTİ</label><select id="playerLimit"><option value="4" selected>4 Oyuncu</option><option value="6">6 Oyuncu</option><option value="8">8 Oyuncu</option><option value="10">10 Oyuncu</option></select></div><div class="setting"><label>🏁 TUR SAYISI</label><select id="roundLimit"><option value="3">3 Tur</option><option value="5" selected>5 Tur</option><option value="10">10 Tur</option></select></div></div><button id="botBtn" class="btn secondary" onclick="addBot()">🤖 Test Botu Ekle</button><button id="startBtn" class="btn" onclick="startGame()">Oyunu Başlat</button></div>
<div id="game" class="card game hidden"><div class="roundbar"><h2 style="margin:0">🔥 Yarış</h2><span id="roundNo" class="roundnum">1. Tur</span></div>
<div id="wheelArea" class="wheel-wrap"><div class="wheel-pointer">▼</div><div id="wheel" class="wheel"><div id="letter" class="wheel-center">?</div></div></div><div id="wheelLabel" class="wheel-label">Harf seçiliyor...</div><div id="timer" class="timer">120 sn</div><div id="status" class="status">Cevaplarını seçilen harfle doldur.</div><div id="answers" class="answers"></div>
<button id="finishBtn" class="btn" onclick="finishRound()">Cevapları Gönder</button><div class="scorebar"><div class="score">Sen<b id="myScore">0</b></div><div class="score">Rakip<b id="enemyScore">0</b></div><div class="score">Tur<b id="roundScore">0</b></div></div></div>
</section></main><div id="toast" class="toast"></div>
<script>
const allCats=['İsim','Hayvan','Şehir','Eşya','Bitki','Ülke','Ünlü','Meslek','Dizi/Film','Sanatçı','Futbolcu','Yemek malzemesi','8 harfli kelime','Şarkı','Erkek ismi','Renk','Yabancı isim','Makyaj malzemesi','Yiyecek','Tatlı'];
let cats=['İsim','Hayvan','Şehir','Eşya','Bitki','Ülke'];
const letters='ABCÇDEFGĞHİIJKLMNOÖPRSŞTUÜVYZ'.split('');
let timerId,seconds=120,round=1,myScore=0,roomId='',me='',letterNow='',bots=[],roundToken=0,roundState=null,totalRounds=5,gameFinished=false;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
function renderCategories(){const box=$('categoryOptions'),selected=$('selectedCats');if(!box||!selected)return;box.innerHTML=allCats.map(cat=>'<button type="button" class="cat-chip '+(cats.includes(cat)?'active':'')+'" data-cat="'+esc(cat)+'">'+esc(cat)+'</button>').join('');box.querySelectorAll('.cat-chip').forEach(btn=>btn.addEventListener('click',()=>toggleCat(btn.dataset.cat)));selected.innerHTML=cats.map(cat=>'<span class="selected-cat">'+esc(cat)+' <button type="button" class="remove-cat" data-cat="'+esc(cat)+'">×</button></span>').join('')||( '<div class="category-empty">En az 1 kategori seç.</div>');selected.querySelectorAll('.remove-cat').forEach(btn=>btn.addEventListener('click',()=>toggleCat(btn.dataset.cat)))}
function toggleCat(cat){if(cats.includes(cat)){if(cats.length===1){toast('En az 1 kategori seçmelisin.');return}cats=cats.filter(x=>x!==cat)}else cats.push(cat);renderCategories()}
function shuffleCats(){cats=[...allCats].sort(()=>Math.random()-.5).slice(0,Math.min(6,allCats.length));renderCategories();toast('Kategoriler karıştırıldı!')}
function enter(name,join){if(!cats.length){toast('En az 1 kategori seçmelisin.');return}me=(name||'Oyuncu').trim()||'Oyuncu';roomId=join?($('joinCode').value.trim()||makeCode()):makeCode();$('lobby').classList.add('hidden');$('categoryPanel').classList.add('hidden');$('room').style.display='block';$('roomCode').textContent=roomId;renderPlayers()}
function createRoom(){enter($('hostName').value,false)}function joinRoom(){enter($('guestName').value,true)}
function copyRoom(){if(navigator.clipboard)navigator.clipboard.writeText(roomId);toast('Oda kodu kopyalandı!')}
function addBot(){const limit=Number($('playerLimit')?.value||4);if(bots.length+1>=limit){toast('Oyuncu limiti dolu.');return}bots.push({name:'Bot '+(bots.length+1),score:0,answers:[]});renderPlayers();toast('🤖 Test botu eklendi')}
function renderPlayers(){$('players').innerHTML='<span class="player">👑 '+esc(me)+'</span>'+bots.map(b=>'<span class="player">🤖 '+esc(b.name)+'</span>').join('')+(bots.length?'':'<span class="player">⏳ Arkadaşın bekleniyor</span>')}
function startGame(){totalRounds=Number($('roundLimit')?.value||5);round=1;gameFinished=false;myScore=0;bots.forEach(b=>b.score=0);$('myScore').textContent='0';$('startBtn').classList.add('hidden');$('botBtn').classList.add('hidden');$('game').classList.remove('hidden');newRound()}
function selectedDuration(){return Number($('durationSelect')?.value||120)}
function newRound(){
 if(!cats.length){toast('Kategori seçilmedi.');return}
 clearInterval(timerId);roundToken++;const token=roundToken;roundState={token,phase:'round'};
 letterNow=letters[Math.floor(Math.random()*letters.length)];$('letter').textContent='?';$('roundNo').textContent=round+'. Tur';
 $('answers').innerHTML=cats.map(c=>'<div class="answer"><label>'+esc(c)+'</label><input maxlength="30" data-cat="'+esc(c)+'" placeholder="'+esc(c)+'..."></div>').join('');
 $('answers').classList.add('hidden-answers');$('timer').textContent=selectedDuration()+' sn';$('timer').classList.remove('danger');$('status').textContent='Harf çarkı dönüyor...';$('finishBtn').disabled=true;$('wheelLabel').textContent='Harf seçiliyor...';
 const wheel=$('wheel');wheel.classList.remove('spinning');void wheel.offsetWidth;
 if($('wheelSelect')?.value==='off'){revealRound(token);return}
 wheel.classList.add('spinning');setTimeout(()=>revealRound(token),2250);
}
function revealRound(token){
 if(token!==roundToken)return;$('wheel').classList.remove('spinning');$('letter').textContent=letterNow;$('wheelLabel').textContent='Seçilen harf';$('answers').classList.remove('hidden-answers');$('status').textContent='Cevaplarını '+letterNow+' harfiyle doldur.';
 seconds=selectedDuration();$('timer').textContent=seconds+' sn';$('finishBtn').textContent='Cevapları Gönder';$('finishBtn').disabled=false;$('finishBtn').onclick=finishRound;
 timerId=setInterval(()=>{seconds--;$('timer').textContent=seconds+' sn';if(seconds<=10)$('timer').classList.add('danger');if(seconds<=0)finishRound()},1000);
}
function pickForLetter(cat){const bank={İsim:{A:'Ahmet',B:'Burak',M:'Mert',S:'Selin'},Şehir:{A:'Ankara',B:'Bursa',T:'Trabzon',İ:'İzmir'},Hayvan:{A:'At',K:'Kedi',M:'Maymun',T:'Tavşan'},Bitki:{A:'Armut',L:'Lale',N:'Nane',Ç:'Çam'},Eşya:{M:'Masa',K:'Kalem',S:'Saat',T:'Telefon'},Ülke:{A:'Almanya',İ:'İtalya',J:'Japonya',T:'Türkiye'}};return bank[cat]?.[letterNow]||letterNow+' örnek'}
function botAnswers(){return cats.map(c=>({cat:c,val:Math.random()>.25?pickForLetter(c):'Alakasız cevap'}))}
function finishRound(){if($('finishBtn').disabled)return;$('finishBtn').disabled=true;clearInterval(timerId);$('timer').classList.remove('danger');bots.forEach(b=>b.answers=botAnswers());roundState.phase='voting';showVoting()}
let votedCount=0;function vote(btn,correct){const row=btn.closest('.vote-player');if(!row)return;const wasVoted=!!row.dataset.vote;row.querySelectorAll('.vote-circle').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');row.dataset.vote=correct?'yes':'no';const square=row.querySelector('.player-vote.my-vote');if(square){square.classList.remove('yes','no');square.classList.add(correct?'yes':'no');square.style.display='inline-flex'}if(!wasVoted)votedCount++;const el=$('voteCount');if(el)el.textContent=votedCount+' / '+document.querySelectorAll('.vote-player[data-owner^="bot"]').length}
function voteRow(owner,x,empty=false){
 const answerOwner=owner==='me'?me:'Bot '+(parseInt(owner.replace('bot',''),10)+1);
 const voterButtons=empty?'':'<button type="button" class="vote-circle no" data-vote-action="no">✕</button><button type="button" class="vote-circle yes" data-vote-action="yes">✓</button>';
 let botVotes='';
 bots.forEach((b,bi)=>{if(owner==='bot'+bi)return;botVotes+='<span class="player-vote bot-vote pending"></span>'});
 return '<div class="vote-player" data-owner="'+owner+'" data-answer="'+esc(answerOwner)+'"><div class="avatar '+(owner.startsWith('bot')?'bot':'')+'">'+(owner.startsWith('bot')?'🤖':'👑')+'</div><div class="vote-info"><div class="vote-name">'+esc(answerOwner)+'</div><div class="vote-value">'+esc(x.val||'Cevap yok')+'</div><div class="vote-note">'+(empty?'Cevap verilmedi':'Oylar')+'</div><div class="vote-voters">'+botVotes+'<span class="player-vote my-vote '+(Math.random()>.5?'yes':'no')+'"></span></div></div><div class="vote-actions">'+voterButtons+'</div></div>'
}
function showVoting(){
 votedCount=0;
 const mine=[...$('answers').querySelectorAll('input')].map(i=>({cat:i.dataset.cat,val:i.value.trim()}));
 bots.forEach(b=>b.answers=botAnswers());
 let html='<div class="vote-title">🗳️ Cevapları Değerlendir</div><div class="vote-help">Senin oyun butonlarda, diğer oyuncuların oyları cevapların altında görünür.</div>';
 cats.forEach(cat=>{html+='<div class="vote-category"><div class="vote-category-title">'+esc(letterNow)+' ile '+esc(cat)+'</div><div class="vote-card">';const mineCat=mine.find(x=>x.cat===cat)||{cat,val:''};html+=voteRow('me',mineCat,!mineCat.val);bots.forEach((bot,bi)=>{const x=bot.answers.find(a=>a.cat===cat);if(x)html+=voteRow('bot'+bi,x,false)});html+='</div></div>'});
 html+='<div class="vote-summary"><span>Senin verdiğin oylar</span><b id="voteCount">0 / '+(cats.length*bots.length)+'</b></div>';
 $('answers').innerHTML=html;$('answers').classList.remove('hidden-answers');$('finishBtn').textContent='Oyları Tamamla';$('finishBtn').disabled=false;$('finishBtn').onclick=completeVoting;$('status').textContent='Cevapları incele ve doğru/yanlış oyunu ver.';
}
function updateVoteSummary(){const rows=$('answers').querySelectorAll('.vote-player');let done=0;rows.forEach(r=>{if(r.dataset.vote)done++});const el=$('voteCount');if(el)el.textContent=done+' / '+rows.length}
function completeVoting(){
 const rows=[...$('answers').querySelectorAll('.vote-player')];
 const myRows=rows.filter(r=>r.querySelector('[data-vote-action]'));
 if(myRows.some(r=>!r.dataset.vote)){toast('Tüm cevaplara oy vermelisin.');return}
 const gains={};[me,...bots.map(b=>b.name)].forEach(n=>gains[n]=0);
 rows.forEach(row=>{const owner=row.dataset.answer;if(!owner)return;const botVotes=row.querySelectorAll('.bot-vote');let yes=0,no=0;botVotes.forEach(x=>x.classList.contains('yes')?yes++:no++);if(row.dataset.vote==='yes')yes++;if(row.dataset.vote==='no')no++;if(yes>no)gains[owner]=(gains[owner]||0)+10});
 const myGain=gains[me]||0;myScore+=myGain;bots.forEach(b=>{b.score=(b.score||0)+(gains[b.name]||0)});$('myScore').textContent=myScore;$('roundScore').textContent=myGain;$('finishBtn').disabled=true;showResults(gains);
}
function showResults(gains){roundState.phase='results';
 const list=Object.entries(gains).sort((a,b)=>b[1]-a[1]);let html='<div class="result-panel"><div class="result-hero"><div>🏆 Tur Sonucu</div><div class="big-score">+'+(gains[me]||0)+'</div><div style="color:var(--muted)">Bu tur kazandığın puan</div></div><div class="leaderboard">'+list.map((x,i)=>'<div class="leader-row"><div class="rank">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1))+'</div><div class="leader-name">'+esc(x[0])+'</div><div class="leader-gain">+'+x[1]+'</div></div>').join('')+'</div><button class="btn result-next" onclick="nextRound()">Sonraki Tur →</button></div>';
 $('answers').innerHTML=html;$('status').textContent='Tur tamamlandı!';$('finishBtn').classList.add('hidden');
}
function nextRound(){if(gameFinished)return;if(round>=totalRounds){gameFinished=true;showFinalResults();return}$('finishBtn').classList.remove('hidden');round++;newRound()}
function showFinalResults(){const all=[{name:me,score:myScore},...bots.map(b=>({name:b.name,score:b.score||0}))].sort((a,b)=>b.score-a.score);$('answers').innerHTML='<div class="result-panel"><div class="result-hero"><div>🏆 OYUN BİTTİ</div><div class="big-score">'+(all[0]?.score||0)+'</div><div style="color:var(--muted)">Toplam puan</div></div><div class="leaderboard">'+all.map((x,i)=>'<div class="leader-row"><div class="rank">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1))+'</div><div class="leader-name">'+esc(x.name)+'</div><div class="leader-gain">'+x.score+'</div></div>').join('')+'</div><button class="btn result-next" onclick="location.reload()">Yeni Oyun</button></div>';$('status').textContent='Oyun tamamlandı!';}
document.addEventListener('DOMContentLoaded',()=>{renderCategories();$('answers').addEventListener('click',e=>{const btn=e.target.closest('[data-vote-action]');if(!btn||btn.disabled)return;vote(btn,btn.dataset.voteAction==='yes')})});
</script></body></html>
